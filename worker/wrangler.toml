name = "tps-lead"
main = "lead-worker.js"
compatibility_date = "2026-07-01"

# Delivery uses Cloudflare Email Routing's send binding — NO Resend, no third
# party. crcp183@gmail.com is already a verified Email Routing destination
# (bookings@totalpropertysolution.net forwards to it), so sends work immediately.
[[send_email]]
name = "LEAD_MAIL"
destination_address = "crcp183@gmail.com"

[vars]
LEAD_TO = "crcp183@gmail.com"      # must be a verified Email Routing destination
LEAD_FROM = "leads@totalpropertysolution.net"  # any address on the routed domain
ALLOW_ORIGIN = "https://totalpropertysolution.net"

# After deploy, add a custom route (Workers & Pages → tps-lead → Settings →
# Domains & Routes) for lead.totalpropertysolution.net, then set
# window.TPS_LEAD_ENDPOINT = 'https://lead.totalpropertysolution.net' in fresh.js.
