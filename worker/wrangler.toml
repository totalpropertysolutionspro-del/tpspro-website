name = "tps-lead"
main = "lead-worker.js"
compatibility_date = "2026-07-01"

[vars]
LEAD_TO = "crcp183@gmail.com"
# Zero-setup sender: Resend lets you send FROM onboarding@resend.dev TO your own
# account email (crcp183@gmail.com) with NO domain verification — just an API key.
# Later, verify totalpropertysolution.net in Resend and switch this to
# leads@totalpropertysolution.net so it sends from your own domain.
LEAD_FROM = "onboarding@resend.dev"
ALLOW_ORIGIN = "https://totalpropertysolution.net"

# Custom domain route (optional but recommended): after `wrangler deploy`, add a
# route in the Cloudflare dashboard (Workers & Pages → tps-lead → Settings →
# Domains & Routes) for  lead.totalpropertysolution.net  — then set
# window.TPS_LEAD_ENDPOINT = 'https://lead.totalpropertysolution.net' in fresh.js.
